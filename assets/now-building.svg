<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="304" viewBox="0 0 1200 304" role="img" aria-labelledby="title desc">
  <title id="title">Now building: NovaBound</title>
  <desc id="desc">NovaBound component map. Launcher (desktop launcher) leads to Client (custom 1.8.9 client), which connects to NovaSpigot (PandaSpigot-based server kernel). Auth Service (identity service and short-lived tickets) also feeds NovaSpigot. Ops bot (Discord operations bot) is attached to NovaSpigot. All five components are active; repositories are private and in development.</desc>

  <defs>
    <style>
      .sans { font-family: Inter, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 2.5px; }
      .micro { font-size: 12px; letter-spacing: 2px; }
      .name { font-size: 20px; font-weight: 600; fill: #D2D2D2; }
      .desc { font-size: 15px; fill: #8A8A8F; }
    </style>
    <clipPath id="card">
      <rect width="1200" height="304" rx="16"/>
    </clipPath>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0.5H0.5V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.02"/>
    </pattern>
  </defs>

  <!-- Card -->
  <g clip-path="url(#card)">
    <rect width="1200" height="304" fill="#060305"/>
    <rect width="1200" height="304" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="303" rx="15.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Title row -->
  <text x="48" y="46" class="sans label"><tspan fill="#8A8A8F">NOW BUILDING &#8212; </tspan><tspan fill="#D2D2D2">NOVABOUND</tspan></text>
  <text x="1152" y="46" text-anchor="end" class="mono micro" fill="#8A8A8F">MINECRAFT 1.8.9</text>
  <path d="M48 68.5H1152" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Connectors: Launcher -> Client -> NovaSpigot <- Auth Service -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <path d="M224 130H259M460 130H495M834 130H798" stroke-opacity="0.18"/>
    <path d="M255 125.5L260 130L255 134.5M491 125.5L496 130L491 134.5M802 125.5L797 130L802 134.5" stroke-opacity="0.45" stroke-width="1.25"/>
    <path d="M646.5 173V195" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  </g>
  <g fill="#060305" stroke="#FFFFFF" stroke-opacity="0.45">
    <circle cx="646.5" cy="168" r="2.5"/>
    <circle cx="646.5" cy="200" r="2.5"/>
  </g>

  <!-- Nodes -->
  <g class="sans">
    <g>
      <rect x="48.5" y="92.5" width="167" height="75" rx="10" fill="#0E0B10" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="68" y="124" class="name">Launcher</text>
      <text x="68" y="148" class="desc">Desktop launcher</text>
      <circle cx="194" cy="117" r="9" fill="#A051A2" fill-opacity="0.16"/>
      <circle cx="194" cy="117" r="4" fill="#A051A2"/>
    </g>
    <g>
      <rect x="268.5" y="92.5" width="183" height="75" rx="10" fill="#0E0B10" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="288" y="124" class="name">Client</text>
      <text x="288" y="148" class="desc">Custom 1.8.9 client</text>
      <circle cx="430" cy="117" r="9" fill="#A051A2" fill-opacity="0.16"/>
      <circle cx="430" cy="117" r="4" fill="#A051A2"/>
    </g>
    <g>
      <rect x="504.5" y="92.5" width="284" height="75" rx="10" fill="#15111A" stroke="#FFFFFF" stroke-opacity="0.1"/>
      <text x="524" y="124" class="name">NovaSpigot</text>
      <text x="524" y="148" class="desc">PandaSpigot-based server kernel</text>
      <circle cx="767" cy="117" r="9" fill="#A051A2" fill-opacity="0.16"/>
      <circle cx="767" cy="117" r="4" fill="#A051A2"/>
    </g>
    <g>
      <rect x="842.5" y="92.5" width="309" height="75" rx="10" fill="#0E0B10" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="862" y="124" class="name">Auth Service</text>
      <text x="862" y="148" class="desc">Identity service &amp; short-lived tickets</text>
      <circle cx="1130" cy="117" r="9" fill="#A051A2" fill-opacity="0.16"/>
      <circle cx="1130" cy="117" r="4" fill="#A051A2"/>
    </g>
    <g>
      <rect x="504.5" y="200.5" width="284" height="75" rx="10" fill="#0E0B10" stroke="#FFFFFF" stroke-opacity="0.08"/>
      <text x="524" y="232" class="name">Ops bot</text>
      <text x="524" y="256" class="desc">Discord operations bot</text>
      <circle cx="767" cy="225" r="9" fill="#A051A2" fill-opacity="0.16"/>
      <circle cx="767" cy="225" r="4" fill="#A051A2"/>
    </g>
  </g>

  <!-- Status -->
  <text x="48" y="232" class="mono micro" fill="#8A8A8F">STATUS</text>
  <text x="178" y="232" class="sans" font-size="16" fill="#D2D2D2">Active development</text>
  <text x="48" y="256" class="mono micro" fill="#8A8A8F">VISIBILITY</text>
  <text x="178" y="256" class="sans" font-size="16" fill="#D2D2D2">Private repositories</text>
</svg>
