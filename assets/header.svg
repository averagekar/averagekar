<svg xmlns="http://www.w3.org/2000/svg"
  width="1200"
  height="430"
  viewBox="0 0 1200 430">

  <defs>

```
<linearGradient id="bg"
                x1="0"
                y1="0"
                x2="1"
                y2="1">

  <stop offset="0%" stop-color="#0b0c0f"/>
  <stop offset="100%" stop-color="#111318"/>

</linearGradient>

<linearGradient id="fade"
                x1="0"
                y1="0"
                x2="1"
                y2="0">

  <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
  <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>

</linearGradient>

<radialGradient id="halo"
                cx="80%"
                cy="50%"
                r="45%">

  <stop offset="0%"
        stop-color="#ffffff"
        stop-opacity="0.055"/>

  <stop offset="100%"
        stop-color="#ffffff"
        stop-opacity="0"/>

</radialGradient>

<filter id="blur">
  <feGaussianBlur stdDeviation="24"/>
</filter>
```

  </defs>

  <!-- background -->

<rect width="1200"
     height="430"
     rx="14"
     fill="url(#bg)"/>

  <!-- subtle atmosphere -->

<rect width="1200"
     height="430"
     rx="14"
     fill="url(#halo)"/>

<ellipse cx="960"
        cy="215"
        rx="210"
        ry="150"
        fill="#ffffff"
        opacity="0.025"
        filter="url(#blur)"/>

