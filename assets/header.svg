<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0B0C"/>
      <stop offset="0.55" stop-color="#101012"/>
      <stop offset="1" stop-color="#080809"/>
    </linearGradient>

    <radialGradient id="glow" cx="0" cy="0" r="1"
      gradientUnits="userSpaceOnUse"
      gradientTransform="translate(920 70) rotate(115) scale(390 330)">
      <stop stop-color="#FFFFFF" stop-opacity="0.075"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="line" x1="90" y1="0" x2="1080" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.82" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft">
      <feGaussianBlur stdDeviation="32"/>
    </filter>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" stroke="#FFFFFF" stroke-opacity="0.018"/>
    </pattern>

    <style>
      .display {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
        font-weight: 700;
        letter-spacing: -2px;
      }

      .label {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
        font-weight: 600;
        letter-spacing: 2.4px;
      }

      .body {
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }

      .mono {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
        letter-spacing: 1px;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="18" fill="url(#glow)"/>

  <!-- Subtle atmosphere -->
  <ellipse
    cx="930"
    cy="90"
    rx="260"
    ry="150"
    fill="#FFFFFF"
    fill-opacity="0.025"
    filter="url(#soft)"
  />

  <!-- Outer frame -->
  <rect
    x="0.75"
    y="0.75"
    width="1198.5"
    height="418.5"
    rx="17.25"
    stroke="#FFFFFF"
    stroke-opacity="0.09"
  />

  <!-- Top micro label -->
  <text
    x="72"
    y="62"
    class="label"
    font-size="10"
    fill="#FFFFFF"
    fill-opacity="0.42">
    INDEPENDENT SOFTWARE DEVELOPER
  </text>

  <!-- Main identity -->
  <text
    x="70"
    y="154"
    class="display"
    font-size="68"
    fill="#FFFFFF">
    AVERAGEKXR
  </text>

  <text
    x="73"
    y="188"
    class="body"
    font-size="15"
    fill="#FFFFFF"
    fill-opacity="0.42">
    Java · Minecraft · Networking · Infrastructure
  </text>

  <!-- Divider -->
  <rect
    x="72"
    y="224"
    width="1056"
    height="1"
    fill="url(#line)"
  />

  <!-- Project -->
  <text
    x="72"
    y="266"
    class="label"
    font-size="9"
    fill="#FFFFFF"
    fill-opacity="0.32">
    CURRENT PROJECT
  </text>

  <text
    x="72"
    y="301"
    class="display"
    font-size="29"
    letter-spacing="-0.8"
    fill="#FFFFFF">
    NOVASPIGOT
  </text>

  <text
    x="72"
    y="328"
    class="body"
    font-size="13"
    fill="#FFFFFF"
    fill-opacity="0.43">
    A custom 1.8.x server fork focused on networking,
  </text>

  <text
    x="72"
    y="348"
    class="body"
    font-size="13"
    fill="#FFFFFF"
    fill-opacity="0.43">
    performance and long-term infrastructure.
  </text>

  <!-- Right-side index -->
  <text
    x="1080"
    y="270"
    text-anchor="end"
    class="mono"
    font-size="10"
    fill="#FFFFFF"
    fill-opacity="0.25">
    01
  </text>

  <text
    x="1080"
    y="303"
    text-anchor="end"
    class="mono"
    font-size="10"
    fill="#FFFFFF"
    fill-opacity="0.25">
    JAVA
  </text>

  <text
    x="1080"
    y="326"
    text-anchor="end"
    class="mono"
    font-size="10"
    fill="#FFFFFF"
    fill-opacity="0.25">
    NETTY
  </text>

  <text
    x="1080"
    y="349"
    text-anchor="end"
    class="mono"
    font-size="10"
    fill="#FFFFFF"
    fill-opacity="0.25">
    GRADLE
  </text>

  <!-- Footer -->
  <text
    x="72"
    y="388"
    class="mono"
    font-size="9"
    fill="#FFFFFF"
    fill-opacity="0.23">
    AVERAGEKAR · 2026
  </text>

  <text
    x="1128"
    y="388"
    text-anchor="end"
    class="mono"
    font-size="9"
    fill="#FFFFFF"
    fill-opacity="0.23">
    BUILD · EXPLORE · REBUILD
  </text>
</svg>
