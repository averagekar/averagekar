<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="360"
     viewBox="0 0 1200 360">

  <defs>

    <!-- Background -->
    <linearGradient id="background"
                    x1="0"
                    y1="0"
                    x2="0"
                    y2="1">

      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#08090c"/>

    </linearGradient>


    <!-- Very subtle light -->
    <radialGradient id="light"
                    cx="50%"
                    cy="25%"
                    r="65%">

      <stop offset="0"
            stop-color="#ffffff"
            stop-opacity="0.045"/>

      <stop offset="1"
            stop-color="#ffffff"
            stop-opacity="0"/>

    </radialGradient>


    <!-- Tiny blocks -->
    <pattern id="blocks"
             width="48"
             height="48"
             patternUnits="userSpaceOnUse">

      <rect width="48"
            height="48"
            fill="none"/>

      <rect x="1"
            y="1"
            width="46"
            height="46"
            fill="none"
            stroke="#ffffff"
            stroke-opacity="0.018"/>

    </pattern>


    <!-- soft glow -->
    <filter id="soft">
      <feGaussianBlur stdDeviation="8"/>
    </filter>


    <!-- moving light -->
    <linearGradient id="beam"
                    x1="0"
                    y1="0"
                    x2="1"
                    y2="0">

      <stop offset="0"
            stop-color="#ffffff"
            stop-opacity="0"/>

      <stop offset="50%"
            stop-color="#ffffff"
            stop-opacity="0.12"/>

      <stop offset="100%"
            stop-color="#ffffff"
            stop-opacity="0"/>

    </linearGradient>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND                                             -->
  <!-- ====================================================== -->

  <rect width="1200"
        height="360"
        rx="12"
        fill="url(#background)"/>


  <rect width="1200"
        height="360"
        rx="12"
        fill="url(#blocks)"/>


  <rect width="1200"
        height="360"
        rx="12"
        fill="url(#light)"/>


  <!-- ====================================================== -->
  <!-- TOP MICRO TEXT                                         -->
  <!-- ====================================================== -->

  <text x="600"
        y="55"
        text-anchor="middle"
        fill="#656b75"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        letter-spacing="4">

    AVERAGEKXR

  </text>


  <!-- ====================================================== -->
  <!-- MAIN NAME                                              -->
  <!-- ====================================================== -->

  <text x="600"
        y="145"
        text-anchor="middle"
        fill="#f0f2f5"
        font-family="Arial, Helvetica, sans-serif"
        font-size="64"
        font-weight="700"
        letter-spacing="-2">

    averagekxr

    <animate
      attributeName="opacity"
      from="0"
      to="1"
      dur="1.4s"
      fill="freeze"/>

  </text>


  <!-- ====================================================== -->
  <!-- UNDERLINE                                              -->
  <!-- ====================================================== -->

  <rect x="515"
        y="164"
        width="170"
        height="1"
        fill="#ffffff"
        opacity="0.16">

    <animate
      attributeName="width"
      from="0"
      to="170"
      dur="1.1s"
      fill="freeze"/>

  </rect>


  <!-- ====================================================== -->
  <!-- DESCRIPTION                                            -->
  <!-- ====================================================== -->

  <text x="600"
        y="198"
        text-anchor="middle"
        fill="#858b95"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        letter-spacing="1">

    java · minecraft · systems

  </text>


  <!-- ====================================================== -->
  <!-- PROJECT                                               -->
  <!-- ====================================================== -->

  <text x="600"
        y="250"
        text-anchor="middle"
        fill="#555b65"
        font-family="Arial, Helvetica, sans-serif"
        font-size="10"
        letter-spacing="2">

    CURRENTLY BUILDING

  </text>


  <text x="600"
        y="278"
        text-anchor="middle"
        fill="#d8dbe0"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        font-weight="600"
        letter-spacing="0.5">

    NovaSpigot

  </text>


  <!-- ====================================================== -->
  <!-- LITTLE WORLD / BLOCKS                                  -->
  <!-- ====================================================== -->

  <g opacity="0.22">

    <rect x="170" y="306"
          width="7" height="7"
          fill="#aeb4bd"/>

    <rect x="198" y="326"
          width="5" height="5"
          fill="#777d86"/>

    <rect x="250" y="315"
          width="4" height="4"
          fill="#9da3ac"/>

    <rect x="318" y="334"
          width="7" height="7"
          fill="#626872"/>

    <rect x="390" y="308"
          width="5" height="5"
          fill="#aeb4bd"/>

    <rect x="445" y="327"
          width="4" height="4"
          fill="#777d86"/>

    <rect x="520" y="315"
          width="6" height="6"
          fill="#aeb4bd"/>

    <rect x="610" y="329"
          width="5" height="5"
          fill="#777d86"/>

    <rect x="690" y="310"
          width="6" height="6"
          fill="#9da3ac"/>

    <rect x="760" y="333"
          width="4" height="4"
          fill="#aeb4bd"/>

    <rect x="820" y="316"
          width="7" height="7"
          fill="#626872"/>

    <rect x="895" y="329"
          width="5" height="5"
          fill="#9da3ac"/>

    <rect x="960" y="308"
          width="4" height="4"
          fill="#777d86"/>

    <rect x="1015" y="326"
          width="7" height="7"
          fill="#aeb4bd"/>

  </g>


  <!-- ====================================================== -->
  <!-- VERY SUBTLE MOTION                                     -->
  <!-- ====================================================== -->

  <rect x="-250"
        y="0"
        width="180"
        height="360"
        fill="url(#beam)"
        opacity="0.18">

    <animateTransform
      attributeName="transform"
      type="translate"
      from="0 0"
      to="1500 0"
      dur="14s"
      repeatCount="indefinite"/>

  </rect>


  <!-- ====================================================== -->
  <!-- BORDER                                                 -->
  <!-- ====================================================== -->

  <rect x="0.5"
        y="0.5"
        width="1199"
        height="359"
        rx="12"
        fill="none"
        stroke="#ffffff"
        stroke-opacity="0.06"/>

</svg>
